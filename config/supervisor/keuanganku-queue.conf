[program:keuanganku-queue]
; Program name
process_name=%(program_name)s_%(process_num)02d

; Command to run - Sesuaikan path sesuai server Anda
; GANTI /path/to/keuanganku dengan path project yang sebenarnya
command=php /path/to/keuanganku/artisan queue:work database --sleep=3 --tries=3 --timeout=30

; Working directory
directory=/path/to/keuanganku

; Run sebagai user (sesuaikan dengan server Anda)
; Biasanya: www-data (Apache/Nginx), nobody, atau dedicated user
user=www-data

; Number of processes - berapa banyak worker yang berjalan parallel
; Rekomendasi: jumlah CPU cores atau 2x cores untuk high-volume
numprocs=2

; Auto restart pada reboot
autostart=true

; Auto restart jika process crash
autorestart=true

; Priority - worker dengan priority tinggi start duluan
; 999 = start paling belakang (aman)
priority=999

; Memory limit - restart jika melebihi (dalam MB)
; 512MB untuk KeuanganKu sudah cukup
memorymax=512

; Redirect stdout ke log file
stdout_logfile=/var/log/keuanganku-queue.log

; Redirect stderr ke log file
stderr_logfile=/var/log/keuanganku-queue-error.log

; Log file settings
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; Signal untuk stop gracefully
stopsignal=TERM
stopasgroup=true
killasgroup=true

; Jangan restart jika exit code sukses (0)
autorestart=true

; Delay sebelum restart (dalam detik)
startsecs=10
stopwaitsecs=10

; Redirect log untuk monitoring
redirect_stderr=false

; Uncomment untuk debugging
; silent=true


; ============================================================================
; NOTES SETUP
; ============================================================================
;
; 1. Copy file ini ke /etc/supervisor/conf.d/keuanganku-queue.conf
;    $ sudo cp config/supervisor/keuanganku-queue.conf /etc/supervisor/conf.d/
;
; 2. Edit path sesuai server:
;    - Ganti /path/to/keuanganku dengan path project sebenarnya
;    - Ganti user (www-data, nobody, dll) sesuai server
;
; 3. Register dengan supervisor:
;    $ sudo supervisorctl reread
;    $ sudo supervisorctl update
;
; 4. Start worker:
;    $ sudo supervisorctl start keuanganku-queue
;
; 5. Check status:
;    $ sudo supervisorctl status
;
; 6. View logs:
;    $ tail -f /var/log/keuanganku-queue.log
;
; ============================================================================
; USEFUL COMMANDS
; ============================================================================
;
; # View status
; sudo supervisorctl status
;
; # Start
; sudo supervisorctl start keuanganku-queue
;
; # Stop
; sudo supervisorctl stop keuanganku-queue
;
; # Restart
; sudo supervisorctl restart keuanganku-queue
;
; # Interactive shell
; sudo supervisorctl
;
; # View logs
; tail -f /var/log/keuanganku-queue.log
; tail -f /var/log/keuanganku-queue-error.log
;
; # Check running processes
; ps aux | grep keuanganku
;
; ============================================================================
; TROUBLESHOOTING
; ============================================================================
;
; Issue: Worker tidak start
;   - Check: /var/log/supervisor/supervisord.log
;   - Verify: artisan queue:work bisa run manual
;   - Check: DB connection, QUEUE_CONNECTION di .env
;
; Issue: High memory usage
;   - Reduce numprocs
;   - Increase memorymax atau decrease memorymax untuk auto-restart
;   - Profile code untuk memory leak
;
; Issue: Jobs tidak diproses
;   - Check: ps aux | grep queue
;   - Check: QUEUE_CONNECTION benar (database / redis)
;   - Check: jobs table ada records
;   - Restart: sudo supervisorctl restart keuanganku-queue
;
; ============================================================================
